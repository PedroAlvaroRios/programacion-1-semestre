<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online - Inicio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        header {
            background: #333;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
        }
        nav {
            background: #444;
            padding: 0.5rem;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 1rem;
            display: inline-block;
        }
        nav a:hover {
            color: #ffd700;
        }
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }
        .producto {
            border: 1px solid #ddd;
            padding: 1rem;
            text-align: center;
            border-radius: 8px;
        }
        .producto img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Tienda Online</h1>
        <p>Los mejores productos al mejor precio</p>
    </header>

    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#productos">Productos</a>
        <a href="#contacto">Contacto</a>
        <a href="#carrito">Carrito</a>
    </nav>

    <main>
        <section id="productos">
            <h2>Nuestros Productos</h2>
            <div class="productos">
                <div class="producto">
                    <img src="producto1.jpg" alt="Producto 1">
                    <h3>Producto 1</h3>
                    <p>Descripción del producto</p>
                    <p>Precio: $99.99</p>
                    <button>Agregar al carrito</button>
                </div>
                <div class="producto">
                    <img src="producto2.jpg" alt="Producto 2">
                    <h3>Producto 2</h3>
                    <p>Descripción del producto</p>
                    <p>Precio: $149.99</p>
                    <button>Agregar al carrito</button>
                </div>
                <div class="producto">
                    <img src="producto3.jpg" alt="Producto 3">
                    <h3>Producto 3</h3>
                    <p>Descripción del producto</p>
                    <p>Precio: $199.99</p>
                    <button>Agregar al carrito</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
